name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Package-data smoke test
        run: python -c "from importlib.resources import files; assert (files('dragonfruitme') / 'SKILL.md').is_file()"
      - name: Test
        run: pytest
